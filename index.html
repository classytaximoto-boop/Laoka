<!DOCTYPE html>
<html lang="mg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>LAOKA — Inona no andrahoina androany?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="app-logo"><span class="mark">🍲</span> LAOKA</div>
  <button class="admin-access-btn" id="adminAccessBtn" aria-label="Accès Admin">⚙️</button>
</header>

<main>
  <section id="screen-home" class="screen active" aria-label="Accueil"></section>
  <section id="screen-laoka" class="screen" aria-label="Laoka"></section>
  <section id="screen-tsopitra" class="screen" aria-label="Tsopitra"></section>
  <section id="screen-courses" class="screen" aria-label="Courses"></section>
  <section id="screen-profil" class="screen" aria-label="Profil"></section>
  <section id="screen-admin" class="screen" aria-label="Admin">
    <button class="btn btn-tertiary" id="backToAppBtn" style="margin:14px 0;">← Retour à l'application</button>
  </section>
</main>

<nav class="bottom-nav" aria-label="Navigation principale">
  <button class="nav-item active" data-screen="home"><span class="nav-icon">🏠</span><span>Accueil</span></button>
  <button class="nav-item" data-screen="laoka"><span class="nav-icon">🍽️</span><span>Laoka</span></button>
  <button class="nav-item" data-screen="tsopitra">
    <span class="nav-icon">🧺</span><span>Tsopitra</span>
    <span class="nav-badge hidden" id="tsopitraBadge">0</span>
  </button>
  <button class="nav-item" data-screen="courses"><span class="nav-icon">🛒</span><span>Courses</span></button>
  <button class="nav-item" data-screen="profil"><span class="nav-icon">👤</span><span>Profil</span></button>
</nav>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<!-- DATA -->
<script src="data.js"></script>
<!-- LOGIC: DATA / CALCUL / STOCK / RECOMMANDATION -->
<script src="app.js"></script>
<!-- UI -->
<script src="ui.js"></script>
<script src="ui-tsopitra.js"></script>
<script src="ui-courses.js"></script>
<script src="ui-profil.js"></script>
<script src="ui-laoka-form.js"></script>
<script src="ui-ro-mazava.js"></script>
<script src="ui-admin.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    UI.init();
  });
</script>

</body>
</html>
